    <style>
      @font-face {
        font-family: 'Aptos';
        src: local('Aptos'), local('Aptos Display'), local('Segoe UI'), sans-serif;
      }
      body {
        font-family: 'Aptos', 'Segoe UI', sans-serif;
        background-color: #f8fafc;
      }
      /* Hide number input spinners */
      input::-webkit-outer-spin-button,
      input::-webkit-inner-spin-button {
        -webkit-appearance: none;
        margin: 0;
      }
      input[type=number] {
        -moz-appearance: textfield;
      }
      /* Smooth transitions for modal and interactions */
      .animate-fade-in {
        animation: fadeIn 0.2s ease-out;
      }
      @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
      }
    </style>
